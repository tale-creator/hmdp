    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    #url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  data:
   redis:
    host: 192.168.32.129
    port: 6379
    password: wyt516817
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
